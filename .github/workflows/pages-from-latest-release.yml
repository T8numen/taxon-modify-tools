      - name: Download release HTML asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # 取最新 release 的 tag（不依赖 --latest 参数）
            TAG="$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"
          fi

          echo "Using release tag: $TAG"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.html" --dir site --clobber

          echo "Downloaded files:"
          ls -la site || true

          mapfile -d '' files < <(find site -maxdepth 1 -type f -name "*.html" -print0)
          [ "${#files[@]}" -gt 0 ] || { echo "ERROR: no .html asset found in release $TAG"; exit 1; }

          chosen="$(ls -S "${files[@]}" | head -n 1)"
          echo "Chosen HTML: $chosen"
          cp "$chosen" site/index.html
