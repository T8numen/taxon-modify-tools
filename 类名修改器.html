<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>类名修改器</title>
    <style>
      :root {
        --bg-1: #f7f1e6;
        --bg-2: #ffe4c7;
        --bg-3: #e8f0ff;
        --ink: #1f1b16;
        --muted: #6f665b;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-strong: rgba(255, 255, 255, 0.92);
        --border: rgba(28, 23, 19, 0.12);
        --shadow: 0 20px 50px rgba(33, 26, 20, 0.18);
        --accent: #ff7a4d;
        --accent-2: #2e6d5a;
        --accent-3: #355e9a;
        --chip-bg: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "KaiTi", "STKaiti", "FangSong", serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 20%, var(--bg-2), transparent 40%),
          radial-gradient(circle at 85% 15%, #ffd2b8, transparent 45%),
          radial-gradient(circle at 10% 85%, #d7e6ff, transparent 45%),
          linear-gradient(160deg, var(--bg-1), #fdf9f2 45%, var(--bg-3));
        min-height: 100vh;
        padding: 32px 22px 60px;
        overflow-x: hidden;
        --scale: 1;
        --line-height: 1.2;
      }

      body[data-scale="1"] {
        --scale: 0.8;
        --line-height: 1.05;
      }

      body[data-scale="2"] {
        --scale: 0.9;
        --line-height: 1.1;
      }

      body[data-scale="3"] {
        --scale: 1;
        --line-height: 1.2;
      }

      body[data-scale="4"] {
        --scale: 1.1;
        --line-height: 1.3;
      }

      body[data-scale="5"] {
        --scale: 1.2;
        --line-height: 1.4;
      }

      .ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        filter: blur(35px);
        opacity: 0.35;
      }

      .ambient::before {
        top: -80px;
        left: -60px;
        background: #ffc38e;
        animation: float 12s ease-in-out infinite;
      }

      .ambient::after {
        bottom: -120px;
        right: -40px;
        background: #c4d8ff;
        animation: float 16s ease-in-out infinite reverse;
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(18px, -16px);
        }
      }

      .app {
        position: relative;
        z-index: 1;
        width: 50vw;
        max-width: 50vw;
        margin: 0 auto;
        overflow-x: hidden;
        animation: fadeUp 0.6s ease-out;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .top {
        background: var(--panel-strong);
        border-radius: 24px;
        padding: 22px 24px 18px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }

      .title-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .title {
        font-size: 28px;
        letter-spacing: 2px;
        font-weight: 600;
      }

      .subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .search-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      #searchInput {
        width: 25vw;
        min-width: 220px;
        max-width: 420px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        outline: none;
        transition: box-shadow 0.2s ease;
      }

      #searchInput:focus {
        box-shadow: 0 0 0 3px rgba(255, 122, 77, 0.2);
      }

      .regex-control {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--border);
      }

      .toggle {
        position: relative;
        width: 50px;
        height: 28px;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #e9e9eb;
        transition: background 0.2s ease;
      }

      .toggle-thumb {
        position: absolute;
        top: 3px;
        left: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        transition: transform 0.2s ease;
      }

      .toggle input:checked + .toggle-track {
        background: #34c759;
      }

      .toggle input:checked + .toggle-track .toggle-thumb {
        transform: translateX(20px);
      }

      #regexState {
        font-size: 13px;
        color: var(--muted);
      }

      .action-row {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .scale-row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .scale-label {
        font-size: 13px;
        color: var(--muted);
      }

      .scale-buttons {
        display: inline-flex;
        gap: 8px;
      }

      .scale-btn {
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.9);
        padding: calc(6px * var(--scale)) calc(12px * var(--scale));
        font-size: calc(13px * var(--scale));
        cursor: pointer;
      }

      .scale-btn.active {
        background: linear-gradient(135deg, #ff8a5c, #ffd275);
        border-color: transparent;
        color: #2b1c13;
        font-weight: 600;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      .ghost,
      .primary {
        border-radius: calc(14px * var(--scale));
        border: 1px solid var(--border);
        padding: calc(10px * var(--scale)) calc(16px * var(--scale));
        font-size: calc(14px * var(--scale));
        background: var(--chip-bg);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .ghost:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(30, 24, 19, 0.12);
      }

      .primary {
        background: linear-gradient(135deg, #ff8a5c, #ffd275);
        border: none;
        color: #2b1c13;
        font-weight: 600;
      }

      .primary:hover {
        background: linear-gradient(135deg, #ff7a4d, #ffc15a);
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(255, 122, 77, 0.25);
      }

      .primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .status-row {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .status-row .error {
        color: #c84d3c;
        font-weight: 600;
      }

      .list {
        margin-top: calc(16px * var(--scale));
        display: flex;
        flex-direction: column;
        gap: calc(6px * var(--scale));
        user-select: none;
        cursor: grab;
        overflow-x: hidden;
        touch-action: pan-y;
      }

      .list.dragging {
        cursor: grabbing;
      }

      .line-row {
        display: grid;
        grid-template-columns: calc(120px * var(--scale)) 1fr;
        gap: calc(10px * var(--scale));
        padding: calc(10px * var(--scale)) calc(12px * var(--scale));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: calc(14px * var(--scale));
        box-shadow: 0 8px 16px rgba(20, 16, 12, 0.08);
        animation: lineRise 0.4s ease-out;
        animation-delay: calc(var(--i) * 18ms);
        animation-fill-mode: both;
      }

      @keyframes lineRise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .line-row.commented {
        opacity: 0.75;
        border-style: dashed;
      }

      .line-row.modified {
        border-color: rgba(255, 122, 77, 0.5);
        box-shadow: 0 10px 26px rgba(255, 122, 77, 0.12);
      }

      .line-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: calc(6px * var(--scale));
      }

      .line-index {
        font-size: calc(12px * var(--scale));
        color: var(--muted);
        text-align: right;
        padding-top: calc(2px * var(--scale));
        line-height: var(--line-height);
      }

      .parts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: calc(6px * var(--scale));
      }

      .part-btn {
        border-radius: calc(10px * var(--scale));
        border: 1px solid rgba(20, 16, 12, 0.12);
        background: rgba(255, 255, 255, 0.9);
        padding: calc(6px * var(--scale)) calc(10px * var(--scale));
        font-size: calc(12px * var(--scale));
        line-height: var(--line-height);
        text-align: left;
        min-width: calc(96px * var(--scale));
        max-width: 100%;
        word-break: break-all;
        white-space: pre-wrap;
        display: inline-flex;
        align-items: center;
        gap: calc(6px * var(--scale));
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .part-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(33, 26, 20, 0.15);
      }

      .part-btn.part-0 {
        border-color: rgba(53, 94, 154, 0.4);
        background: linear-gradient(135deg, #f5f8ff, #e4efff);
      }

      .part-btn.part-1 {
        border-color: rgba(46, 109, 90, 0.4);
        background: linear-gradient(135deg, #f3fff8, #dff5ea);
      }

      .part-btn.part-2 {
        border-color: rgba(255, 122, 77, 0.5);
        background: linear-gradient(135deg, #fff7f2, #ffe2d3);
        font-family: "Cascadia Mono", "Consolas", monospace;
      }

      .part-btn.empty {
        font-style: italic;
        color: var(--muted);
        border-style: dashed;
      }

      .line-actions {
        display: inline-flex;
        align-items: center;
        gap: calc(6px * var(--scale));
        margin-left: calc(2px * var(--scale));
      }

      .line-action {
        border-radius: calc(10px * var(--scale));
        border: 1px dashed rgba(20, 16, 12, 0.25);
        background: rgba(255, 255, 255, 0.86);
        padding: calc(6px * var(--scale)) calc(10px * var(--scale));
        font-size: calc(12px * var(--scale));
        line-height: var(--line-height);
        color: var(--muted);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .line-action:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 12px rgba(33, 26, 20, 0.12);
      }

      .line-action.comment-toggle.commented {
        color: #b3473a;
        border-color: rgba(200, 77, 60, 0.45);
        background: rgba(255, 236, 232, 0.9);
      }

      .line-action.add-rgb {
        border-style: solid;
        border-color: rgba(255, 122, 77, 0.4);
        color: #9a3c22;
      }

      .line-action.delete-rgb {
        border-style: solid;
        border-color: rgba(53, 94, 154, 0.4);
        color: #355e9a;
      }

      .color-chip {
        width: calc(14px * var(--scale));
        height: calc(14px * var(--scale));
        border-radius: calc(4px * var(--scale));
        border: 1px solid rgba(0, 0, 0, 0.2);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        background: var(--chip, #ccc);
      }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(22, 18, 14, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 10;
        padding: 20px;
      }

      .modal.open {
        opacity: 1;
        pointer-events: auto;
      }

      .panel {
        background: var(--panel-strong);
        border-radius: 20px;
        padding: 18px;
        border: 1px solid var(--border);
        min-width: 280px;
        box-shadow: var(--shadow);
        animation: pop 0.25s ease;
      }

      @keyframes pop {
        from {
          transform: translateY(6px) scale(0.98);
          opacity: 0.8;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .icon-btn {
        border: none;
        background: transparent;
        font-size: 20px;
        cursor: pointer;
        color: var(--muted);
      }

      .panel-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .field-label {
        font-size: 13px;
        color: var(--muted);
      }

      .text-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 14px;
      }

      .panel-actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .color-panel {
        width: min(760px, 96vw);
      }

      .color-body {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 20px;
      }

      .picker {
        display: flex;
        gap: 14px;
      }

      .sv-area {
        width: 240px;
        height: 240px;
        border-radius: 16px;
        position: relative;
        background: red;
        cursor: crosshair;
        overflow: hidden;
        border: 1px solid rgba(20, 16, 12, 0.2);
      }

      .sv-area::before,
      .sv-area::after {
        content: "";
        position: absolute;
        inset: 0;
      }

      .sv-area::before {
        background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0));
      }

      .sv-area::after {
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000);
      }

      .sv-cursor {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25);
        transform: translate(-50%, -50%);
      }

      .hue-bar {
        width: 22px;
        height: 240px;
        border-radius: 999px;
        background: linear-gradient(
          to bottom,
          #ff0000,
          #ffff00,
          #00ff00,
          #00ffff,
          #0000ff,
          #ff00ff,
          #ff0000
        );
        position: relative;
        border: 1px solid rgba(20, 16, 12, 0.2);
        cursor: pointer;
      }

      .hue-thumb {
        position: absolute;
        left: 50%;
        width: 28px;
        height: 8px;
        background: #fff;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        transform: translate(-50%, -50%);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .preview {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .swatch {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(20, 16, 12, 0.2);
        position: relative;
        overflow: hidden;
      }

      .swatch::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-conic-gradient(
          rgba(0, 0, 0, 0.08) 0% 25%,
          transparent 0% 50%
        );
        background-size: 16px 16px;
      }

      .swatch::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--swatch, rgba(255, 255, 255, 1));
      }

      .rgba-text {
        font-size: 14px;
        font-family: "Cascadia Mono", "Consolas", monospace;
        color: var(--muted);
      }

      .inputs {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px 16px;
      }

      .inputs label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .inputs input[type="number"],
      .inputs input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 13px;
        font-family: "Cascadia Mono", "Consolas", monospace;
      }

      .alpha-row {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #aRange {
        flex: 1;
      }

      .empty-state {
        padding: 22px;
        text-align: center;
        color: var(--muted);
        background: var(--panel);
        border-radius: 16px;
        border: 1px dashed var(--border);
      }

      @media (max-width: 900px) {
        .app {
          width: 100%;
          max-width: 100%;
        }
        #searchInput {
          width: 70vw;
        }
        .line-row {
          grid-template-columns: calc(100px * var(--scale)) 1fr;
        }
        .color-body {
          grid-template-columns: 1fr;
        }
        .picker {
          justify-content: center;
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 18px 14px 40px;
        }
        .top {
          padding: 18px;
        }
        .sv-area {
          width: 200px;
          height: 200px;
        }
        .hue-bar {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient"></div>
    <main class="app">
      <header class="top">
        <div class="title-row">
          <div class="title">类名修改器</div>
          <div class="subtitle">点击行或分段进行修改，RGB 使用悬浮窗确认。</div>
        </div>
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="搜索类名 / 名称 / RGB" />
          <div class="regex-control">
            <label class="toggle">
              <input type="checkbox" id="regexToggle" />
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </label>
            <span id="regexState">正则: 关</span>
          </div>
        </div>
        <div class="action-row">
          <button id="openDir" class="ghost">打开目录</button>
          <button id="openFile" class="ghost">选择类名.txt</button>
          <button id="saveCopy" class="primary">生成修改版</button>
        </div>
        <div class="scale-row">
          <span class="scale-label">界面大小</span>
          <div class="scale-buttons">
            <button class="scale-btn" data-scale="1">1</button>
            <button class="scale-btn" data-scale="2">2</button>
            <button class="scale-btn" data-scale="3">3</button>
            <button class="scale-btn" data-scale="4">4</button>
            <button class="scale-btn" data-scale="5">5</button>
          </div>
        </div>
        <div class="status-row">
          <span id="statusText">未加载类名.txt</span>
          <span id="filterInfo"></span>
          <span id="regexError" class="error"></span>
        </div>
      </header>
      <section class="list" id="lineList">
        <div class="empty-state">请先加载类名.txt</div>
      </section>
    </main>

    <div class="modal" id="textModal" aria-hidden="true">
      <div class="panel">
        <div class="panel-header">
          <h2>修改内容</h2>
          <button class="icon-btn" data-close="textModal" aria-label="关闭">×</button>
        </div>
        <div class="panel-body">
          <div class="field-label" id="textEditLabel">内容</div>
          <input class="text-input" id="textEditInput" type="text" />
        </div>
        <div class="panel-actions">
          <button id="textCancel" class="ghost">取消</button>
          <button id="textSave" class="primary">确定</button>
        </div>
      </div>
    </div>

    <div class="modal" id="colorModal" aria-hidden="true">
      <div class="panel color-panel">
        <div class="panel-header">
          <h2>RGB颜色选择器</h2>
          <button class="icon-btn" data-close="colorModal" aria-label="关闭">×</button>
        </div>
        <div class="panel-body color-body">
          <div class="picker">
            <div class="sv-area" id="svArea">
              <div class="sv-cursor" id="svCursor"></div>
            </div>
            <div class="hue-bar" id="hueBar">
              <div class="hue-thumb" id="hueThumb"></div>
            </div>
          </div>
          <div class="controls">
            <div class="preview">
              <div class="swatch" id="swatch"></div>
              <div class="rgba-text" id="rgbaText">0, 0, 0, 255</div>
            </div>
            <div class="inputs">
              <label>R <input id="rInput" type="number" min="0" max="255" /></label>
              <label>G <input id="gInput" type="number" min="0" max="255" /></label>
              <label>B <input id="bInput" type="number" min="0" max="255" /></label>
              <label># <input id="hexInput" type="text" maxlength="7" /></label>
              <div class="alpha-row">
                <label>A <input id="aInput" type="number" min="0" max="255" /></label>
                <input id="aRange" type="range" min="0" max="255" />
              </div>
            </div>
            <div class="panel-actions">
              <button id="colorCancel" class="ghost">取消</button>
              <button id="colorSave" class="primary">确定</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input id="filePicker" type="file" accept=".txt" hidden />

    <script>
      const searchInput = document.getElementById("searchInput");
      const regexToggle = document.getElementById("regexToggle");
      const regexState = document.getElementById("regexState");
      const regexError = document.getElementById("regexError");
      const statusText = document.getElementById("statusText");
      const filterInfo = document.getElementById("filterInfo");
      const lineList = document.getElementById("lineList");
      const openDirButton = document.getElementById("openDir");
      const openFileButton = document.getElementById("openFile");
      const saveCopyButton = document.getElementById("saveCopy");
      const filePicker = document.getElementById("filePicker");
      const scaleButtons = document.querySelectorAll(".scale-btn");

      const textModal = document.getElementById("textModal");
      const textEditLabel = document.getElementById("textEditLabel");
      const textEditInput = document.getElementById("textEditInput");
      const textCancel = document.getElementById("textCancel");
      const textSave = document.getElementById("textSave");

      const colorModal = document.getElementById("colorModal");
      const svArea = document.getElementById("svArea");
      const svCursor = document.getElementById("svCursor");
      const hueBar = document.getElementById("hueBar");
      const hueThumb = document.getElementById("hueThumb");
      const swatch = document.getElementById("swatch");
      const rgbaText = document.getElementById("rgbaText");
      const rInput = document.getElementById("rInput");
      const gInput = document.getElementById("gInput");
      const bInput = document.getElementById("bInput");
      const aInput = document.getElementById("aInput");
      const aRange = document.getElementById("aRange");
      const hexInput = document.getElementById("hexInput");
      const colorCancel = document.getElementById("colorCancel");
      const colorSave = document.getElementById("colorSave");

      let lines = [];
      let activeEdit = null;
      let dirHandle = null;
      let lineBreak = "\r\n";
      let updatingColor = false;
      let colorState = { h: 0, s: 1, v: 1, r: 255, g: 0, b: 0, a: 255 };
      let dragState = {
        active: false,
        startY: 0,
        startScroll: 0,
        suppressClick: false,
      };

      saveCopyButton.disabled = true;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function hsvToRgb(h, s, v) {
        const c = v * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = v - c;
        let r1 = 0;
        let g1 = 0;
        let b1 = 0;

        if (h >= 0 && h < 60) {
          r1 = c;
          g1 = x;
          b1 = 0;
        } else if (h < 120) {
          r1 = x;
          g1 = c;
          b1 = 0;
        } else if (h < 180) {
          r1 = 0;
          g1 = c;
          b1 = x;
        } else if (h < 240) {
          r1 = 0;
          g1 = x;
          b1 = c;
        } else if (h < 300) {
          r1 = x;
          g1 = 0;
          b1 = c;
        } else {
          r1 = c;
          g1 = 0;
          b1 = x;
        }

        return {
          r: Math.round((r1 + m) * 255),
          g: Math.round((g1 + m) * 255),
          b: Math.round((b1 + m) * 255),
        };
      }

      function rgbToHsv(r, g, b) {
        const r1 = r / 255;
        const g1 = g / 255;
        const b1 = b / 255;
        const max = Math.max(r1, g1, b1);
        const min = Math.min(r1, g1, b1);
        const delta = max - min;
        let h = 0;

        if (delta !== 0) {
          if (max === r1) {
            h = 60 * (((g1 - b1) / delta) % 6);
          } else if (max === g1) {
            h = 60 * ((b1 - r1) / delta + 2);
          } else {
            h = 60 * ((r1 - g1) / delta + 4);
          }
        }

        if (h < 0) {
          h += 360;
        }

        const s = max === 0 ? 0 : delta / max;
        const v = max;
        return { h, s, v };
      }

      function formatRgb(rgba) {
        return `${rgba.r}, ${rgba.g}, ${rgba.b}, ${rgba.a}`;
      }

      function parseRgba(text) {
        const match = text.match(/(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/);
        if (!match) {
          return null;
        }
        const r = clamp(parseInt(match[1], 10), 0, 255);
        const g = clamp(parseInt(match[2], 10), 0, 255);
        const b = clamp(parseInt(match[3], 10), 0, 255);
        const a = clamp(parseInt(match[4], 10), 0, 255);
        return { r, g, b, a };
      }

      function toHex(r, g, b) {
        return (
          "#" +
          [r, g, b]
            .map((value) => value.toString(16).padStart(2, "0"))
            .join("")
            .toUpperCase()
        );
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function updateSummary() {
        if (!lines.length) {
          filterInfo.textContent = "";
          return;
        }
        const modified = lines.filter((line) => line.raw !== line.originalRaw).length;
        filterInfo.textContent = `行数 ${lines.length} · 修改 ${modified}`;
      }

      function normalizeLine(line) {
        const raw = line.raw;
        const hasPipe = raw.includes("|");
        let parts = hasPipe ? raw.split("|") : [raw];
        if (hasPipe && parts.length > 3) {
          parts = [parts[0], parts[1], parts.slice(2).join("|")];
        }
        line.hasPipe = hasPipe;
        line.parts = parts;
        line.isCommented = raw.startsWith("-");
        return line;
      }

      function getClassLineInfo(line) {
        if (!line.hasPipe || line.parts.length < 2) {
          return { isClassLine: false };
        }
        const part0 = line.parts[0] || "";
        const part1 = line.parts[1] || "";
        const part0Clean = part0.startsWith("-") ? part0.slice(1) : part0;
        const isClassLine = part0Clean.trim() !== "" && part1.trim() !== "";
        return { isClassLine, part0Clean, name: part1.trim() };
      }

      function parseLines(text) {
        return text.split(/\r?\n/).map((raw) =>
          normalizeLine({
            raw,
            originalRaw: raw,
          })
        );
      }

      function buildPartButton(text, partIndex, isEmpty, rgba) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `part-btn part-${partIndex}${isEmpty ? " empty" : ""}`;
        button.dataset.part = partIndex;
        if (rgba) {
          const chip = document.createElement("span");
          chip.className = "color-chip";
          chip.style.setProperty(
            "--chip",
            `rgba(${rgba.r}, ${rgba.g}, ${rgba.b}, ${rgba.a / 255})`
          );
          button.appendChild(chip);
        }
        button.appendChild(document.createTextNode(text));
        return button;
      }

      function buildLineRow(line, index) {
        const row = document.createElement("div");
        row.className = "line-row";
        row.dataset.index = index;
        row.style.setProperty("--i", Math.min(index, 40));
        if (line.isCommented) {
          row.classList.add("commented");
        }
        if (line.raw !== line.originalRaw) {
          row.classList.add("modified");
        }

        const classInfo = getClassLineInfo(line);

        const metaEl = document.createElement("div");
        metaEl.className = "line-meta";
        if (classInfo.isClassLine) {
          const commentBtn = document.createElement("button");
          commentBtn.type = "button";
          commentBtn.className = "line-action comment-toggle";
          commentBtn.dataset.action = "toggle-comment";
          commentBtn.textContent = line.isCommented ? "取消注释" : "注释";
          if (line.isCommented) {
            commentBtn.classList.add("commented");
          }
          metaEl.appendChild(commentBtn);
        }

        const indexEl = document.createElement("div");
        indexEl.className = "line-index";
        indexEl.textContent = String(index + 1).padStart(4, "0");
        metaEl.appendChild(indexEl);
        row.appendChild(metaEl);

        const partsWrap = document.createElement("div");
        partsWrap.className = "parts";

        if (line.hasPipe) {
          line.parts.forEach((part, partIndex) => {
            const display = part === "" ? "（空）" : part;
            const rgba = partIndex === 2 ? parseRgba(part) : null;
            partsWrap.appendChild(
              buildPartButton(display, partIndex, part === "", rgba)
            );
            if (partIndex === 2) {
              const deleteBtn = document.createElement("button");
              deleteBtn.type = "button";
              deleteBtn.className = "line-action delete-rgb";
              deleteBtn.dataset.action = "delete-rgb";
              deleteBtn.textContent = "删除RGB";
              partsWrap.appendChild(deleteBtn);
            }
          });
        } else {
          const display = line.raw === "" ? "（空行）" : line.raw;
          partsWrap.appendChild(buildPartButton(display, 0, line.raw === ""));
        }

        if (classInfo.isClassLine && line.parts.length === 2) {
          const actionsWrap = document.createElement("div");
          actionsWrap.className = "line-actions";

          const addRgbBtn = document.createElement("button");
          addRgbBtn.type = "button";
          addRgbBtn.className = "line-action add-rgb";
          addRgbBtn.dataset.action = "add-rgb";
          addRgbBtn.textContent = "添加RGB";
          actionsWrap.appendChild(addRgbBtn);

          partsWrap.appendChild(actionsWrap);
        }

        row.appendChild(partsWrap);
        return row;
      }

      function renderLines() {
        lineList.innerHTML = "";
        if (!lines.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "请先加载类名.txt";
          lineList.appendChild(empty);
          return;
        }
        lines.forEach((line, index) => {
          lineList.appendChild(buildLineRow(line, index));
        });
      }

      function updateLineRow(index) {
        const row = lineList.querySelector(`.line-row[data-index="${index}"]`);
        if (!row) {
          return;
        }
        row.replaceWith(buildLineRow(lines[index], index));
      }

      function applySearch() {
        const query = searchInput.value.trim();
        const useRegex = regexToggle.checked;
        let matcher = null;
        regexError.textContent = "";

        if (useRegex && query) {
          try {
            matcher = new RegExp(query);
          } catch (error) {
            regexError.textContent = "正则表达式无效";
          }
        }

        let visibleCount = 0;
        lines.forEach((line, index) => {
          const row = lineList.querySelector(`.line-row[data-index="${index}"]`);
          if (!row) {
            return;
          }
          let match = true;
          if (query) {
            if (useRegex) {
              match = matcher ? matcher.test(line.raw) : false;
            } else {
              match = line.raw.toLowerCase().includes(query.toLowerCase());
            }
          }
          row.style.display = match ? "" : "none";
          if (match) {
            visibleCount += 1;
          }
        });
        if (lines.length) {
          filterInfo.textContent = `显示 ${visibleCount} / ${lines.length}`;
        }
      }

      function toggleComment(lineIndex) {
        const line = lines[lineIndex];
        if (!line) {
          return;
        }
        const info = getClassLineInfo(line);
        if (!info.isClassLine) {
          return;
        }
        line.raw = line.raw.startsWith("-") ? line.raw.slice(1) : "-" + line.raw;
        normalizeLine(line);
        updateLineRow(lineIndex);
        updateSummary();
        applySearch();
      }

      function addRgb(lineIndex) {
        const line = lines[lineIndex];
        if (!line) {
          return;
        }
        const info = getClassLineInfo(line);
        if (!info.isClassLine || line.parts.length !== 2) {
          return;
        }
        line.parts = [...line.parts, "255, 255, 255, 255"];
        line.raw = line.parts.join("|");
        normalizeLine(line);
        updateLineRow(lineIndex);
        updateSummary();
        applySearch();
      }

      function deleteRgb(lineIndex) {
        const line = lines[lineIndex];
        if (!line || !line.hasPipe || line.parts.length < 3) {
          return;
        }
        line.parts = line.parts.slice(0, 2);
        line.raw = line.parts.join("|");
        normalizeLine(line);
        updateLineRow(lineIndex);
        updateSummary();
        applySearch();
      }

      function openModal(modal) {
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal(modal) {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      }

      function openTextEditor(lineIndex, partIndex) {
        activeEdit = { type: "text", lineIndex, partIndex };
        const line = lines[lineIndex];
        const labelText = line.hasPipe
          ? `第 ${partIndex + 1} 部分`
          : "整行内容";
        textEditLabel.textContent = labelText;
        const value = line.hasPipe ? line.parts[partIndex] : line.raw;
        textEditInput.value = value;
        openModal(textModal);
        textEditInput.focus();
      }

      function saveTextEdit() {
        if (!activeEdit || activeEdit.type !== "text") {
          return;
        }
        const { lineIndex, partIndex } = activeEdit;
        const line = lines[lineIndex];
        const newValue = textEditInput.value;

        if (line.hasPipe) {
          line.parts[partIndex] = newValue;
          line.raw = line.parts.join("|");
        } else {
          line.raw = newValue;
        }
        normalizeLine(line);
        updateLineRow(lineIndex);
        updateSummary();
        applySearch();
        closeModal(textModal);
      }

      function setColorStateFromRgb(r, g, b, a) {
        colorState.r = clamp(r, 0, 255);
        colorState.g = clamp(g, 0, 255);
        colorState.b = clamp(b, 0, 255);
        colorState.a = clamp(a, 0, 255);
        const hsv = rgbToHsv(colorState.r, colorState.g, colorState.b);
        colorState.h = hsv.h;
        colorState.s = hsv.s;
        colorState.v = hsv.v;
        renderColorUI();
      }

      function setColorStateFromHsv(h, s, v) {
        colorState.h = clamp(h, 0, 360);
        colorState.s = clamp(s, 0, 1);
        colorState.v = clamp(v, 0, 1);
        const rgb = hsvToRgb(colorState.h, colorState.s, colorState.v);
        colorState.r = rgb.r;
        colorState.g = rgb.g;
        colorState.b = rgb.b;
        renderColorUI();
      }

      function renderColorUI() {
        updatingColor = true;
        svArea.style.backgroundColor = `hsl(${colorState.h}, 100%, 50%)`;
        const svRect = svArea.getBoundingClientRect();
        const x = colorState.s * svRect.width;
        const y = (1 - colorState.v) * svRect.height;
        svCursor.style.left = `${x}px`;
        svCursor.style.top = `${y}px`;
        const hueRect = hueBar.getBoundingClientRect();
        const hueY = (colorState.h / 360) * hueRect.height;
        hueThumb.style.top = `${hueY}px`;

        const rgba = `rgba(${colorState.r}, ${colorState.g}, ${colorState.b}, ${
          colorState.a / 255
        })`;
        swatch.style.setProperty("--swatch", rgba);
        rgbaText.textContent = formatRgb(colorState);
        rInput.value = colorState.r;
        gInput.value = colorState.g;
        bInput.value = colorState.b;
        aInput.value = colorState.a;
        aRange.value = colorState.a;
        hexInput.value = toHex(colorState.r, colorState.g, colorState.b);
        updatingColor = false;
      }

      function openColorEditor(lineIndex, partIndex) {
        activeEdit = { type: "color", lineIndex, partIndex };
        const line = lines[lineIndex];
        const parsed = parseRgba(line.parts[partIndex]);
        if (parsed) {
          setColorStateFromRgb(parsed.r, parsed.g, parsed.b, parsed.a);
        } else {
          setColorStateFromRgb(255, 120, 80, 255);
        }
        openModal(colorModal);
      }

      function saveColorEdit() {
        if (!activeEdit || activeEdit.type !== "color") {
          return;
        }
        const { lineIndex, partIndex } = activeEdit;
        const line = lines[lineIndex];
        line.parts[partIndex] = formatRgb(colorState);
        line.raw = line.parts.join("|");
        normalizeLine(line);
        updateLineRow(lineIndex);
        updateSummary();
        applySearch();
        closeModal(colorModal);
      }

      function handleSvPointer(event) {
        const rect = svArea.getBoundingClientRect();
        const x = clamp(event.clientX - rect.left, 0, rect.width);
        const y = clamp(event.clientY - rect.top, 0, rect.height);
        const s = rect.width ? x / rect.width : 0;
        const v = rect.height ? 1 - y / rect.height : 0;
        setColorStateFromHsv(colorState.h, s, v);
      }

      function handleHuePointer(event) {
        const rect = hueBar.getBoundingClientRect();
        const y = clamp(event.clientY - rect.top, 0, rect.height);
        const h = rect.height ? (y / rect.height) * 360 : 0;
        setColorStateFromHsv(h, colorState.s, colorState.v);
      }

      function attachPointerDrag(target, handler) {
        let dragging = false;
        target.addEventListener("pointerdown", (event) => {
          dragging = true;
          target.setPointerCapture(event.pointerId);
          handler(event);
        });
        target.addEventListener("pointermove", (event) => {
          if (dragging) {
            handler(event);
          }
        });
        target.addEventListener("pointerup", () => {
          dragging = false;
        });
        target.addEventListener("pointercancel", () => {
          dragging = false;
        });
      }

      function formatDateFolder(date) {
        const pad = (value) => String(value).padStart(2, "0");
        return (
          date.getFullYear() +
          "-" +
          pad(date.getMonth() + 1) +
          "-" +
          pad(date.getDate())
        );
      }

      async function fileExists(dirHandle, name) {
        try {
          await dirHandle.getFileHandle(name);
          return true;
        } catch (error) {
          return false;
        }
      }

      async function getAvailableFileName(dirHandle) {
        const baseName = "类名";
        const baseFile = `${baseName}.txt`;
        if (!(await fileExists(dirHandle, baseFile))) {
          return baseFile;
        }
        for (let i = 1; i <= 99; i += 1) {
          const candidate = `${baseName}${i}.txt`;
          if (!(await fileExists(dirHandle, candidate))) {
            return candidate;
          }
        }
        return null;
      }

      async function loadFromText(text, sourceName) {
        lineBreak = text.includes("\r\n") ? "\r\n" : "\n";
        lines = parseLines(text);
        renderLines();
        applySearch();
        setStatus(`已加载 ${sourceName}`);
        updateSummary();
      }

      async function openDirectory() {
        try {
          if (!window.showDirectoryPicker) {
            setStatus("浏览器不支持目录访问，无法写入日期文件夹。");
            return;
          }
          dirHandle = await window.showDirectoryPicker();
          saveCopyButton.disabled = false;
          try {
            const fileHandle = await dirHandle.getFileHandle("类名.txt");
            const file = await fileHandle.getFile();
            await loadFromText(await file.text(), "类名.txt");
          } catch (error) {
            setStatus("已打开目录，但未找到类名.txt，可用“选择类名.txt”。");
          }
        } catch (error) {
          setStatus("已取消目录选择。");
        }
      }

      async function openFilePicker() {
        filePicker.value = "";
        filePicker.click();
      }

      async function saveCopy() {
        if (!lines.length) {
          setStatus("没有可保存的内容。");
          return;
        }
        if (!window.showDirectoryPicker) {
          setStatus("浏览器不支持目录访问，无法写入日期文件夹。");
          return;
        }
        if (!dirHandle) {
          setStatus("请先点击“打开目录”以便创建日期文件夹。");
          return;
        }
        try {
          const dateFolder = formatDateFolder(new Date());
          const dateDirHandle = await dirHandle.getDirectoryHandle(dateFolder, {
            create: true,
          });
          const fileName = await getAvailableFileName(dateDirHandle);
          if (!fileName) {
            setStatus("今日文件已达99个，无法生成。");
            return;
          }
          const content = lines.map((line) => line.raw).join(lineBreak);
          const fileHandle = await dateDirHandle.getFileHandle(fileName, {
            create: true,
          });
          const writable = await fileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          setStatus(`已生成 ${dateFolder}\\${fileName}`);
        } catch (error) {
          setStatus("生成失败，请确认目录权限。");
        }
      }

      function updateRegexState() {
        regexState.textContent = regexToggle.checked ? "正则: 开" : "正则: 关";
      }

      function setScale(level) {
        const value = String(level);
        if (!["1", "2", "3", "4", "5"].includes(value)) {
          return;
        }
        document.body.dataset.scale = value;
        scaleButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.scale === value);
        });
        localStorage.setItem("uiScale", value);
      }

      lineList.addEventListener("click", (event) => {
        if (dragState.suppressClick) {
          return;
        }
        const actionButton = event.target.closest(".line-action");
        if (actionButton) {
          const row = actionButton.closest(".line-row");
          if (!row) {
            return;
          }
          const lineIndex = Number(row.dataset.index);
          const action = actionButton.dataset.action;
          if (action === "toggle-comment") {
            toggleComment(lineIndex);
          }
          if (action === "add-rgb") {
            addRgb(lineIndex);
          }
          if (action === "delete-rgb") {
            deleteRgb(lineIndex);
          }
          return;
        }
        const button = event.target.closest(".part-btn");
        if (!button) {
          return;
        }
        const row = button.closest(".line-row");
        if (!row) {
          return;
        }
        const lineIndex = Number(row.dataset.index);
        const partIndex = Number(button.dataset.part);
        const line = lines[lineIndex];
        if (line.hasPipe && partIndex === 2) {
          openColorEditor(lineIndex, partIndex);
        } else {
          openTextEditor(lineIndex, partIndex);
        }
      });

      function endDrag(event) {
        if (!dragState.active) {
          return;
        }
        dragState.active = false;
        lineList.classList.remove("dragging");
        if (lineList.hasPointerCapture(event.pointerId)) {
          lineList.releasePointerCapture(event.pointerId);
        }
        if (dragState.suppressClick) {
          setTimeout(() => {
            dragState.suppressClick = false;
          }, 0);
        }
      }

      lineList.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) {
          return;
        }
        dragState.active = true;
        dragState.startY = event.clientY;
        dragState.startScroll = window.scrollY;
        dragState.suppressClick = false;
        lineList.classList.add("dragging");
        lineList.setPointerCapture(event.pointerId);
      });

      lineList.addEventListener("pointermove", (event) => {
        if (!dragState.active) {
          return;
        }
        const deltaY = event.clientY - dragState.startY;
        if (Math.abs(deltaY) > 4) {
          dragState.suppressClick = true;
          event.preventDefault();
          window.scrollTo({
            top: dragState.startScroll - deltaY,
            behavior: "auto",
          });
        }
      });

      lineList.addEventListener("pointerup", endDrag);
      lineList.addEventListener("pointercancel", endDrag);

      document.querySelectorAll("[data-close]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.dataset.close);
          closeModal(target);
        });
      });

      [textModal, colorModal].forEach((modal) => {
        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            closeModal(modal);
          }
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeModal(textModal);
          closeModal(colorModal);
        }
        if (event.key === "Enter" && textModal.classList.contains("open")) {
          saveTextEdit();
        }
      });

      textCancel.addEventListener("click", () => closeModal(textModal));
      textSave.addEventListener("click", saveTextEdit);

      colorCancel.addEventListener("click", () => closeModal(colorModal));
      colorSave.addEventListener("click", saveColorEdit);

      attachPointerDrag(svArea, handleSvPointer);
      attachPointerDrag(hueBar, handleHuePointer);

      [rInput, gInput, bInput].forEach((input) => {
        input.addEventListener("input", () => {
          if (updatingColor) {
            return;
          }
          setColorStateFromRgb(
            clamp(parseInt(rInput.value || "0", 10), 0, 255),
            clamp(parseInt(gInput.value || "0", 10), 0, 255),
            clamp(parseInt(bInput.value || "0", 10), 0, 255),
            clamp(parseInt(aInput.value || "255", 10), 0, 255)
          );
        });
      });

      aInput.addEventListener("input", () => {
        if (updatingColor) {
          return;
        }
        setColorStateFromRgb(
          colorState.r,
          colorState.g,
          colorState.b,
          clamp(parseInt(aInput.value || "255", 10), 0, 255)
        );
      });

      aRange.addEventListener("input", () => {
        if (updatingColor) {
          return;
        }
        setColorStateFromRgb(
          colorState.r,
          colorState.g,
          colorState.b,
          clamp(parseInt(aRange.value || "255", 10), 0, 255)
        );
      });

      hexInput.addEventListener("input", () => {
        if (updatingColor) {
          return;
        }
        const hex = hexInput.value.trim().replace("#", "");
        if (/^[0-9a-fA-F]{6}$/.test(hex)) {
          const r = parseInt(hex.slice(0, 2), 16);
          const g = parseInt(hex.slice(2, 4), 16);
          const b = parseInt(hex.slice(4, 6), 16);
          setColorStateFromRgb(r, g, b, colorState.a);
        }
      });

      searchInput.addEventListener("input", applySearch);
      regexToggle.addEventListener("change", () => {
        updateRegexState();
        applySearch();
      });

      scaleButtons.forEach((button) => {
        button.addEventListener("click", () => setScale(button.dataset.scale));
      });

      openDirButton.addEventListener("click", openDirectory);
      openFileButton.addEventListener("click", openFilePicker);
      saveCopyButton.addEventListener("click", saveCopy);

      filePicker.addEventListener("change", async () => {
        const file = filePicker.files[0];
        if (!file) {
          return;
        }
        await loadFromText(await file.text(), file.name);
      });

      async function tryAutoLoad() {
        try {
          const response = await fetch("类名.txt", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("not ok");
          }
          await loadFromText(await response.text(), "类名.txt");
        } catch (error) {
          setStatus("未能自动读取类名.txt，请点击“打开目录”或“选择类名.txt”。");
        }
      }

      const savedScale = localStorage.getItem("uiScale");
      const initialScale = ["1", "2", "3", "4", "5"].includes(savedScale)
        ? savedScale
        : "3";
      setScale(initialScale);

      updateRegexState();
      tryAutoLoad();
    </script>
  </body>
</html>
